[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "infra-automation-core"
version = "1.0.0"
description = "Python automation layer for the Infrastructure Automation Platform"
requires-python = ">=3.12"

# Runtime dependencies — installed in CI
dependencies = []  # defined in extras below

[project.optional-dependencies]
runtime = [
    "pydantic[email]>=2.7",
    "azure-cosmos>=4.7",
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
    "sendgrid>=6.11",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",        # For testing the API layer
]

[project.scripts]
# Allows running: infra-dispatch <request.json>
infra-dispatch = "automation.dispatcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["automation*"]

# ---------------------------------------------------------------------------
# Ruff — linting & formatting
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "A",       # flake8-builtins
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
]
ignore = ["B008", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"
